# Writers Room: everything on one machine with one command.
#   cp .env.example .env   (edit SESSION_SECRET and the bootstrap owner)
#   docker compose up --build
# Web: http://localhost:5173   API: http://localhost:3000   Mail catcher: http://localhost:8025
#
# Source folders are mounted into the containers for live reload. Dependencies live inside the
# images, so run `docker compose build` again after changing a package.json.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: writers_room
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-writers-room-dev}
      POSTGRES_DB: writers_room
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U writers_room -d writers_room']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    # Dev mail catcher (MIT). Every email the app sends lands here instead of a real inbox.
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dev
    command: pnpm --filter @writers-room/server dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://writers_room:${POSTGRES_PASSWORD:-writers-room-dev}@db:5432/writers_room
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-secret-change-me-in-dot-env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: Writers Room <writers-room@localhost>
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-owner@example.com}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:-Owner}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-change-me-please}
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dev
    command: pnpm --filter @writers-room/web dev
    environment:
      VITE_API_PROXY_TARGET: http://server:3000
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      - server
    restart: unless-stopped

  backup:
    # Nightly pg_dump into the `backups` volume (also ./backups on the host). See docs/runbooks/backups.md.
    image: postgres:16-alpine
    command: sh /scripts/backup.sh
    environment:
      PGHOST: db
      PGUSER: writers_room
      PGPASSWORD: ${POSTGRES_PASSWORD:-writers-room-dev}
      PGDATABASE: writers_room
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_ON_START: ${BACKUP_ON_START:-1}
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
